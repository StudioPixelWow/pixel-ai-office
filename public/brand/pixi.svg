    <g fill="url(#gold)">
      <path d="M66 74 c4-6 10-7 14-4 c-4 5-9 7-14 4z"/><path d="M74 64 c3-7 9-9 14-7 c-3 6-8 9-14 7z"/><path d="M85 57 c2-7 8-10 13-9 c-2 7-7 10-13 9z"/>
      <path d="M134 74 c-4-6-10-7-14-4 c4 5 9 7 14 4z"/><path d="M126 64 c-3-7-9-9-14-7 c3 6 8 9 14 7z"/><path d="M115 57 c-2-7-8-10-13-9 c2 7 7 10 13 9z"/>
      <circle cx="100" cy="52" r="4"/>
