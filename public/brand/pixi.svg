    <path d="M86 86 q6-4 12 0" stroke="#9AA8B6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M102 86 q6-4 12 0" stroke="#9AA8B6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M86 93 q6 3 11 0" stroke="#7D8B99" stroke-width="2.6" fill="none" stroke-linecap="round"/>
