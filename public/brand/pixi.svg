    <ellipse cx="84" cy="104" rx="5" ry="3" fill="#00CFFF" opacity=".18"/><ellipse cx="116" cy="104" rx="5" ry="3" fill="#00CFFF" opacity=".18"/>
    <!-- spark -->
    <path d="M154 120 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#E8F401"/>
