<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="פיקסי">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4BE7FF"/><stop offset=".5" stop-color="#00CFFF"/><stop offset="1" stop-color="#0094BD"/></linearGradient>
    <radialGradient id="marble" cx=".42" cy=".35" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EEF2F6"/><stop offset="1" stop-color="#C9D3DD"/></radialGradient>
    <linearGradient id="drape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7FAFC"/><stop offset="1" stop-color="#B9C6D2"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2FB4D"/><stop offset="1" stop-color="#C9D400"/></linearGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="98" fill="#0B1320"/>
